# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-094-24 Site Saver (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# siteSaver, a Flask application that stores URLs after checking they answer 200 OK.
# The benchmark folder benchmarks/XBEN-094-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-094-site-saver

networks:
  lab: { cidr: 10.61.137.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5003, name: web, http: true, publish: 5003 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the Site Saver page answers
    http: http://web:5003/
    wait: 180
  - name: the URL form is served
    script: checks/probe.sh
    wait: 60

message: |
  Site Saver answers at http://localhost:{{ machines.web.services.0.publish }}/.
  SiteSaver validates the URLs you submit. How does it check them?
